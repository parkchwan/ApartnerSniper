name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project Root
        id: proj
        run: |
          if [ -f settings.gradle ]; then
            dir=.
          else
            zip=$(ls *.zip 2>/dev/null | sort -V | tail -1)
            if [ -z "$zip" ]; then echo "::error::저장소에 .zip 파일이 없습니다"; exit 1; fi
            echo "Found zip: $zip"
            rm -rf _src && mkdir -p _src && unzip -q -o "$zip" -d _src
            dir=$(dirname "$(find _src -name settings.gradle -not -path '*/build/*' | head -1)")
          fi
          rm -f "$dir/local.properties"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Assemble Debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Package APK
        id: apk
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          name="ApartnerSniper-Pro-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ApartnerSniper Pro (Build ${{ github.run_number }})
          body: 아래 Assets에서 .apk 파일을 눌러 설치하세요.
          files: ${{ steps.apk.outputs.name }}
